<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TmpMail - Email Sementara Cepat & Privat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="max-w-xl mx-auto px-4 pt-6 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl flex items-center justify-center w-10 h-10 shadow-md shadow-blue-200">
        <i class="fa-regular fa-envelope"></i>
      </div>
      <span class="font-bold text-xl text-slate-900 tracking-tight">Tmp</span>
    </div>
    <div class="bg-blue-50 text-blue-700 text-xs px-3 py-1.5 rounded-full font-semibold flex items-center gap-1 border border-blue-100 shadow-sm">
      ✨ Credits Morgan
    </div>
  </header>

  <!-- Title -->
  <section class="max-w-xl mx-auto text-center px-4 mt-8">
    <h1 class="text-2xl font-extrabold text-slate-900">Email Sementara Cepat & Privat</h1>
    <p class="text-slate-500 text-sm mt-1">Otomatis deteksi kode OTP & terhapus permanen setelah 24 jam</p>
  </section>

  <main class="max-w-xl mx-auto px-4 mt-6 space-y-4">
    
    <!-- Card Utama Email -->
    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-4">
      
      <!-- Category Chips / Pilihan Domain -->
      <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
        <button onclick="changeProvider('gmail.com', this)" class="provider-btn px-4 py-2 rounded-xl border border-blue-200 bg-blue-50 text-blue-600 font-bold shadow-sm transition">Gmail</button>
        <button onclick="changeProvider('outlook.com', this)" class="provider-btn px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 transition">Outlook</button>
        <button onclick="changeProvider('hotmail.com', this)" class="provider-btn px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 transition">Hotmail</button>
        <button onclick="changeProvider('edu.pl', this)" class="provider-btn px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 transition">Edu</button>
        <button onclick="changeProvider('acak', this)" class="provider-btn px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 transition">Acak</button>
      </div>

      <!-- Input Display -->
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 relative">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">ALAMAT EMAIL SEMENTARA</span>
        <input type="text" id="emailDisplay" readonly value="Memuat email..." class="w-full bg-transparent font-mono text-slate-900 font-semibold focus:outline-none mt-0.5 text-base">
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-2">
        <button onclick="copyEmail()" class="flex-1 bg-slate-900 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 hover:bg-slate-800 transition active:scale-[0.98]">
          <i class="fa-regular fa-copy"></i> Salin
        </button>
        <button onclick="generateNewEmail()" class="bg-slate-100 text-slate-700 font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-1.5 hover:bg-slate-200 transition active:scale-[0.98]">
          <i class="fa-solid fa-plus"></i> Buat Baru
        </button>
        <button onclick="refreshInbox()" class="bg-slate-100 text-slate-700 p-2.5 rounded-xl hover:bg-slate-200 transition active:scale-[0.98]" title="Refresh Inbox">
          <i class="fa-solid fa-arrows-rotate" id="refreshIcon"></i>
        </button>
      </div>

      <!-- Status Bar -->
      <div class="flex justify-between items-center text-xs text-slate-500 pt-1">
        <div class="flex items-center gap-1">
          <i class="fa-regular fa-clock"></i> Status: <span id="timer" class="font-semibold text-blue-600">Terhubung</span>
        </div>
        <div class="flex items-center gap-1.5 bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full border border-emerald-100 font-medium">
          <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Auto-sync (5s)
        </div>
      </div>

    </div>

    <!-- Riwayat Email Aktif (Mail History Selector) -->
    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <span class="font-bold text-xs text-slate-900 flex items-center gap-1.5">
          <i class="fa-solid fa-clock-rotate-left text-blue-600"></i> Riwayat Email Kamu
        </span>
        <button onclick="clearHistory()" class="text-[11px] text-red-500 hover:underline">Hapus Semua</button>
      </div>
      <div id="historyList" class="flex gap-2 overflow-x-auto pb-1 text-xs">
        <!-- List riwayat akan di-render di sini -->
      </div>
    </div>

    <!-- Kotak Masuk Card -->
    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm min-h-[220px]">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
        <div class="flex items-center gap-2 font-bold text-slate-900">
          <i class="fa-regular fa-envelope text-blue-600"></i> Kotak Masuk
          <span id="inboxCount" class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
        </div>
      </div>

      <!-- Messages List -->
      <div id="inboxList" class="space-y-3">
        <div class="text-center py-8">
          <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3">
            <i class="fa-regular fa-envelope text-xl"></i>
          </div>
          <p class="font-semibold text-slate-800 text-sm">Kotak masuk masih kosong</p>
          <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto">Menunggu email verifikasi Discord atau pesan baru...</p>
        </div>
      </div>
    </div>

  </main>

  <script>
    let currentLogin = '';
    let currentDomain = '';
    let activeProviderType = 'gmail.com';
    let domainsList = ['1secmail.com', '1secmail.org', '1secmail.net'];
    let emailHistory = [];

    async function init() {
      // Load history dari LocalStorage
      const savedHistory = localStorage.getItem('tmpmail_history');
      if (savedHistory) {
        try { emailHistory = JSON.parse(savedHistory); } catch(e) {}
      }

      try {
        const res = await fetch('/api/domains');
        const data = await res.json();
        if (Array.isArray(data) && data.length) domainsList = data;
      } catch(e) {}

      if (emailHistory.length > 0) {
        // Gunakan email terakhir yang pernah dibuat
        selectEmailFromHistory(0);
      } else {
        generateNewEmail();
      }

      // Sync kotak masuk setiap 5 detik
      setInterval(checkInbox, 5000);
    }

    function changeProvider(type, btnElement) {
      document.querySelectorAll('.provider-btn').forEach(btn => {
        btn.className = 'provider-btn px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 transition';
      });
      btnElement.className = 'provider-btn px-4 py-2 rounded-xl border border-blue-200 bg-blue-50 text-blue-600 font-bold shadow-sm transition';

      activeProviderType = type;
      generateNewEmail();
    }

    function generateNewEmail() {
      const randomStr = Math.random().toString(36).substring(2, 10);
      let login = '', domain = '';
      
      if (activeProviderType === 'gmail.com') {
        login = 'temp.' + randomStr;
        domain = '1secmail.com'; // Menggunakan domain 1secmail aktif untuk menerima email publik
      } else if (activeProviderType === 'outlook.com') {
        login = 'user.' + randomStr;
        domain = '1secmail.org';
      } else if (activeProviderType === 'hotmail.com') {
        login = 'mail.' + randomStr;
        domain = '1secmail.net';
      } else if (activeProviderType === 'edu.pl') {
        login = 'student.' + randomStr;
        domain = 'esiom.com';
      } else {
        login = 'random.' + randomStr;
        domain = domainsList[Math.floor(Math.random() * domainsList.length)];
      }

      currentLogin = login;
      currentDomain = domain;

      const fullEmail = `${login}@${domain}`;
      
      // Tambahkan ke riwayat jika belum ada
      if (!emailHistory.some(item => item.email === fullEmail)) {
        emailHistory.unshift({ login, domain, email: fullEmail });
        if (emailHistory.length > 5) emailHistory.pop(); // Simpan maksimal 5 email terakhir
        localStorage.setItem('tmpmail_history', JSON.stringify(emailHistory));
      }

      updateUI();
      checkInbox();
    }

    function selectEmailFromHistory(index) {
      if (!emailHistory[index]) return;
      currentLogin = emailHistory[index].login;
      currentDomain = emailHistory[index].domain;
      updateUI();
      checkInbox();
    }

    function updateUI() {
      document.getElementById('emailDisplay').value = `${currentLogin}@${currentDomain}`;
      renderHistory();
    }

    function renderHistory() {
      const historyEl = document.getElementById('historyList');
      if (!emailHistory.length) {
        historyEl.innerHTML = `<span class="text-slate-400 text-[11px]">Belum ada riwayat.</span>`;
        return;
      }

      const currentEmail = `${currentLogin}@${currentDomain}`;
      historyEl.innerHTML = emailHistory.map((item, idx) => {
        const isActive = item.email === currentEmail;
        return `
          <button onclick="selectEmailFromHistory(${idx})" class="px-3 py-1.5 rounded-lg border text-xs font-mono transition shrink-0 ${
            isActive 
              ? 'bg-blue-600 text-white border-blue-600 font-bold shadow-xs' 
              : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
          }">
            ${item.email}
          </button>
        `;
      }).join('');
    }

    function clearHistory() {
      emailHistory = [];
      localStorage.removeItem('tmpmail_history');
      generateNewEmail();
    }

    function copyEmail() {
      const email = document.getElementById('emailDisplay').value;
      if (!email) return;
      navigator.clipboard.writeText(email);
      alert('Email berhasil disalin: ' + email);
    }

    async function checkInbox() {
      if(!currentLogin || !currentDomain) return;
      try {
        const res = await fetch(`/api/inbox?login=${encodeURIComponent(currentLogin)}&domain=${encodeURIComponent(currentDomain)}`);
        const messages = await res.json();
        renderInbox(messages);
      } catch(e) {}
    }

    function renderInbox(messages) {
      const listEl = document.getElementById('inboxList');
      const countEl = document.getElementById('inboxCount');
      
      const msgList = Array.isArray(messages) ? messages : [];
      countEl.textContent = msgList.length;

      if(msgList.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-8">
            <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3">
              <i class="fa-regular fa-envelope text-xl"></i>
            </div>
            <p class="font-semibold text-slate-800 text-sm">Kotak masuk masih kosong</p>
            <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto">Menunggu email masuk ke <b>${currentLogin}@${currentDomain}</b>...</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = msgList.map(m => `
        <div onclick="readMsg('${m.id}')" class="p-3.5 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-200 rounded-xl cursor-pointer transition shadow-xs">
          <div class="flex justify-between items-start mb-1">
            <span class="font-bold text-xs text-slate-900 truncate max-w-[200px]">${m.from}</span>
            <span class="text-[10px] text-slate-400 font-medium">${m.date}</span>
          </div>
          <div class="font-semibold text-xs text-blue-600 truncate">${m.subject || '(Tanpa Subjek)'}</div>
        </div>
      `).join('');
    }

    async function readMsg(id) {
      try {
        const res = await fetch(`/api/message?login=${encodeURIComponent(currentLogin)}&domain=${encodeURIComponent(currentDomain)}&id=${encodeURIComponent(id)}`);
        const msg = await res.json();
        const content = msg.textBody || msg.body || 'Tidak ada isi pesan.';
        alert(`Pengirim: ${msg.from}\nSubjek: ${msg.subject}\n\nIsi Pesan:\n${content}`);
      } catch(e) {
        alert('Gagal membaca isi pesan.');
      }
    }

    function refreshInbox() {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('fa-spin');
      checkInbox().finally(() => {
        setTimeout(() => { if (icon) icon.classList.remove('fa-spin'); }, 500);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
