<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morganz Obfuscator Ultimate v6.2 - Neo Brutalism</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #ffde59;
            color: #000;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            padding: 30px;
        }
        h2 {
            font-size: 24px;
            text-transform: uppercase;
            background: #ff5757;
            color: #000;
            padding: 10px;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }
        .grid-editors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media(max-width: 768px) {
            .grid-editors { grid-template-columns: 1fr; }
        }
        .panel {
            background: #f0f0f0;
            border: 3px solid #000;
            padding: 15px;
            box-shadow: 4px 4px 0px #000;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 13px;
        }
        textarea {
            width: 100%;
            height: 250px;
            background: #fff;
            color: #000;
            border: 3px solid #000;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }
        .dropzone {
            border: 3px dashed #000;
            background: #e3f2fd;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .dropzone.dragover {
            background: #bbdefb;
        }
        .btn-process {
            width: 100%;
            background: #00ff66;
            color: #000;
            border: 3px solid #000;
            padding: 15px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            text-transform: uppercase;
            transition: 0.1s;
            margin-bottom: 20px;
        }
        .btn-process:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }
        .log-box {
            width: 100%;
            height: 70px;
            background: #111;
            color: #00ffcc;
            border: 3px solid #000;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            box-shadow: 4px 4px 0px #000;
            margin-bottom: 20px;
            resize: none;
        }
        .download-section {
            background: #ff914d;
            border: 3px solid #000;
            padding: 20px;
            box-shadow: 4px 4px 0px #000;
        }
        .filename-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }
        .filename-group input {
            flex: 1;
            background: #fff;
            border: 3px solid #000;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 2px 2px 0px #000;
        }
        .btn-download {
            width: 100%;
            padding: 15px;
            font-weight: bold;
            border: 3px solid #000;
            font-size: 15px;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px #000;
            cursor: pointer;
        }
        .btn-download.locked {
            background: #ff5757;
            color: #fff;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .btn-download.unlocked {
            background: #76ff03;
            color: #000;
        }
        .btn-download.unlocked:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ Morganz Obfuscator Ultimate v6.2</h2>

        <div class="grid-editors">
            <!-- Kolom Input Source -->
            <div class="panel">
                <label>1. Input Source Code Lua:</label>
                <div id="dropZone" class="dropzone">📁 Seret & Letakkan file .lua di sini atau klik</div>
                <input type="file" id="fileInput" accept=".lua,.txt" style="display: none;">
                <textarea id="srcInput" placeholder="-- Tulis atau paste script lua di sini..."></textarea>
            </div>

            <!-- Kolom Hasil Source -->
            <div class="panel">
                <label>2. Hasil Obfuscate Source:</label>
                <textarea id="outputSource" placeholder="Hasil kode terproteksi akan muncul di sini..." readonly></textarea>
            </div>
        </div>

        <button id="btnProcess" class="btn-process">⚡ Proses Obfuscate (Pipeline Bertahap)</button>

        <label style="font-weight:bold;">Status & Log Tahapan:</label>
        <textarea id="logOutput" class="log-box" readonly>Status: Siap diproses.</textarea>

        <div class="download-section">
            <label>3. Beri Nama File Sebelum Download:</label>
            <div class="filename-group">
                <input type="text" id="fileNameInput" value="script_protected_v62">
                <span style="font-weight: bold; font-size: 16px;">.lua</span>
            </div>
            <button id="btnDownload" class="btn-download locked" disabled>🔒 Download Dikunci (Harap Klik Proses Dulu!)</button>
        </div>
    </div>

    <script>
        let finalProtectedCode = "";
        const srcInput = document.getElementById('srcInput');
        const outputSource = document.getElementById('outputSource');
        const logOutput = document.getElementById('logOutput');
        const btnDownload = document.getElementById('btnDownload');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        // Drag and Drop Handling
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            if (!file) return;
            // Set suggested filename based on uploaded file
            let baseName = file.name.replace(/\.[^/.]+$/, "");
            document.getElementById('fileNameInput').value = baseName + "_protected";

            const reader = new FileReader();
            reader.onload = function(evt) {
                srcInput.value = evt.target.result;
                logOutput.value = "File '" + file.name + "' berhasil dimuat via Drag & Drop.";
            };
            reader.readAsText(file);
        }

        document.getElementById('btnProcess').addEventListener('click', async () => {
            const code = srcInput.value;
            if (!code.trim()) {
                logOutput.value = "[ERROR] Source code masih kosong!";
                return;
            }

            logOutput.value = "Memproses enkripsi XOR ke server...";
            outputSource.value = "Sedang memproses...";

            try {
                const res = await fetch('/api/obfuscate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sourceCode: code })
                });

                const textData = await res.text();
                let data;
                try {
                    data = JSON.parse(textData);
                } catch (parseErr) {
                    throw new Error("Respon server bukan JSON valid: " + textData.substring(0, 100));
                }

                if (data.success) {
                    logOutput.value = data.log;
                    finalProtectedCode = data.protectedCode;
                    outputSource.value = finalProtectedCode;

                    btnDownload.disabled = false;
                    btnDownload.classList.remove('locked');
                    btnDownload.classList.add('unlocked');
                    btnDownload.innerText = "📥 Download File .lua Sekarang";
                } else {
                    logOutput.value = "[ERROR] " + data.error;
                    outputSource.value = "-- Gagal diproses.";
                }
            } catch (err) {
                logOutput.value = "[ERROR] " + err.message;
                outputSource.value = "-- Terjadi kesalahan koneksi server.";
            }
        });

        document.getElementById('btnDownload').addEventListener('click', () => {
            if (!finalProtectedCode) return;
            let customName = document.getElementById('fileNameInput').value.trim();
            if (!customName) customName = "script_protected_v62";
            customName = customName.replace(/\.lua$/, "");

            const blob = new Blob([finalProtectedCode], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = customName + ".lua";
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
