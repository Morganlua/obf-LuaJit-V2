<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORGAN LUA OBFUSCATOR</title>
    <!-- Google Fonts: Space Grotesk biar ala Neo-Brutalism -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: #FFFDF9;
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #FFDE59;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            padding: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 20px;
            background: #000;
            color: #FFF;
            padding: 10px;
            text-align: center;
            border: 3px solid #000;
        }

        .label {
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            font-size: 14px;
        }

        /* Drop Zone Area */
        .drop-zone {
            background: #FFF;
            border: 4px dashed #000;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.1s ease;
        }

        .drop-zone.dragover {
            background: #FF99C8;
        }

        .drop-zone p {
            margin: 0;
            font-weight: 700;
            font-size: 16px;
        }

        /* Input & Textarea Neo-Brutalism Style */
        input[type="text"], textarea {
            width: 100%;
            border: 4px solid #000;
            padding: 12px;
            font-weight: 700;
            font-size: 15px;
            background: #FFF;
            box-shadow: 4px 4px 0px #000;
            margin-bottom: 20px;
            outline: none;
        }

        textarea {
            resize: vertical;
            height: 150px;
        }

        /* Tombol Aksi */
        .btn-group {
            display: flex;
            gap: 15px;
        }

        button {
            flex: 1;
            background: #FF5757;
            color: #FFF;
            border: 4px solid #000;
            padding: 15px;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        button.btn-blue {
            background: #4361EE;
        }

        button:disabled {
            background: #ccc;
            border-color: #666;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #status {
            margin-top: 15px;
            font-weight: 700;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Morgan Obfuscator</h1>

        <!-- Drop Zone File -->
        <span class="label">Upload File .lua (Drag & Drop atau Klik)</span>
        <div id="dropZone" class="drop-zone">
            <p>📁 Seret file .lua ke sini atau klik untuk pilih file</p>
            <input type="file" id="fileInput" accept=".lua" style="display: none;">
        </div>

        <span class="label">Atau Ketik / Paste Kode Lua</span>
        <textarea id="codeSource" placeholder="Paste kode Lua kamu di sini..."></textarea>

        <span class="label">Nama File Hasil Download</span>
        <input type="text" id="fileNameInput" value="protected_script" placeholder="Contoh: my_script">

        <div class="btn-group">
            <button id="btnProcess">Proses</button>
            <button id="btnDownload" class="btn-blue" disabled>Download</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const codeSource = document.getElementById('codeSource');
        const fileNameInput = document.getElementById('fileNameInput');
        const btnProcess = document.getElementById('btnProcess');
        const btnDownload = document.getElementById('btnDownload');
        const statusDiv = document.getElementById('status');

        let protectedResultCode = "";

        // Event Klik Dropzone buat pilih file
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        // Drag and Drop Events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            // Ambil nama file asli (tanpa ekstensi .lua) untuk otomatis isi nama file output
            const originalName = file.name.replace(/\.[^/.]+$/, "");
            fileNameInput.value = originalName + "_protected";

            const reader = new FileReader();
            reader.onload = (e) => {
                codeSource.value = e.target.result;
                statusDiv.innerText = "File " + file.name + " berhasil dimuat!";
                statusDiv.style.color = "green";
            };
            reader.readAsText(file);
        }

        // Tombol Proses Obfuscate ke Vercel API
        btnProcess.addEventListener('click', async () => {
            const code = codeSource.value.trim();
            if (!code) {
                alert("Kode Lua masih kosong!");
                return;
            }

            btnProcess.disabled = true;
            statusDiv.innerText = "Sedang meng-obfuscate kode...";
            statusDiv.style.color = "#000";

            try {
                // Sesuaikan URL '/api/obfuscate' dengan domain Vercel kamu jika di-host terpisah
                const response = await fetch('/api/obfuscate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });

                const data = await response.json();
                if (data.success) {
                    protectedResultCode = data.code;
                    btnDownload.disabled = false;
                    statusDiv.innerText = "Berhasil! Silakan klik tombol Download.";
                    statusDiv.style.color = "green";
                } else {
                    statusDiv.innerText = "Gagal: " + (data.error || "Terjadi kesalahan");
                    statusDiv.style.color = "red";
                }
            } catch (err) {
                statusDiv.innerText = "Gagal terhubung ke server Vercel!";
                statusDiv.style.color = "red";
            } finally {
                btnProcess.disabled = false;
            }
        });

        // Tombol Download File
        btnDownload.addEventListener('click', () => {
            if (!protectedResultCode) {
                alert("[ERROR] Belum ada bytecode/kode untuk didownload!");
                return;
            }

            let customName = fileNameInput.value.trim();
            if (!customName) customName = "protected_script";
            if (!customName.endsWith('.lua')) customName += '.lua';

            const blob = new Blob([protectedResultCode], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = customName;
            link.click();
        });
    </script>
</body>
</html>
