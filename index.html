<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obfuscator LuaJit Bytecode 5.1 For safe</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #ffe600;
      --card-bg: #ffffff;
      --text-color: #000000;
      --accent-pink: #ff007f;
      --accent-green: #00ff66;
      --accent-cyan: #00f0ff;
      --border-style: 4px solid #000000;
      --shadow-hard: 6px 6px 0px #000000;
      --shadow-pressed: 2px 2px 0px #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 950px; }

    header { background: var(--card-bg); border: var(--border-style); box-shadow: var(--shadow-hard); padding: 24px; margin-bottom: 25px; text-align: center; }
    header h1 { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; background: var(--accent-cyan); display: inline-block; padding: 6px 14px; border: 3px solid #000; box-shadow: 4px 4px 0px #000; margin-bottom: 10px; }
    header p { font-family: 'Fira Code', monospace; font-weight: 700; font-size: 0.85rem; background: var(--accent-pink); color: #fff; display: inline-block; padding: 4px 10px; border: 2px solid #000; }

    .panel-group { background: var(--card-bg); border: var(--border-style); box-shadow: var(--shadow-hard); padding: 16px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
    .input-row { display: flex; flex-direction: column; gap: 6px; }
    .input-row label { font-weight: 900; font-size: 0.85rem; text-transform: uppercase; }
    .input-row input[type="text"] { padding: 10px; font-family: 'Fira Code', monospace; font-size: 0.85rem; border: 3px solid #000; font-weight: 700; outline: none; }
    .file-input-hidden { display: none; }

    .editor-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 768px) { .editor-grid { grid-template-columns: 1fr 1fr; } }

    .box { background: var(--card-bg); border: var(--border-style); box-shadow: var(--shadow-hard); padding: 18px; display: flex; flex-direction: column; }
    .box-title { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #000; padding-bottom: 8px; }
    .badge { font-family: 'Fira Code', monospace; font-size: 0.75rem; padding: 2px 8px; border: 2px solid #000; background: var(--bg-color); font-weight: bold; }

    textarea { width: 100%; height: 260px; font-family: 'Fira Code', monospace; font-size: 0.85rem; padding: 12px; border: 3px solid #000; background-color: #fafafa; color: #000; resize: vertical; outline: none; font-weight: 500; }
    textarea:focus { background-color: #fff; }

    .button-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .btn { font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; font-weight: 900; text-transform: uppercase; padding: 10px 16px; border: var(--border-style); background: var(--accent-green); color: #000; cursor: pointer; box-shadow: var(--shadow-hard); transition: all 0.1s ease; display: inline-flex; align-items: center; justify-content: center; user-select: none; text-decoration: none; }
    .btn:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0px #000; }
    .btn:active { transform: translate(3px, 3px); box-shadow: var(--shadow-pressed); }
    .btn-cyan { background: var(--accent-cyan); }
    .btn-pink { background: var(--accent-pink); color: #fff; }
    .btn-yellow { background: var(--bg-color); }

    #statusBar { display: none; margin-top: 20px; padding: 12px; border: var(--border-style); box-shadow: var(--shadow-hard); font-family: 'Fira Code', monospace; font-weight: 700; font-size: 0.85rem; text-align: center; }
    .status-loading { background: var(--bg-color); color: #000; }
    .status-success { background: var(--accent-green); color: #000; }
    .status-error { background: var(--accent-pink); color: #fff; }

    footer { margin-top: 35px; margin-bottom: 20px; font-family: 'Fira Code', monospace; font-size: 0.8rem; font-weight: 700; text-align: center; background: #000; color: #fff; padding: 8px 16px; border: 3px solid #000; box-shadow: 4px 4px 0px var(--card-bg); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Obfuscator LuaJit Bytecode 5.1 For safe</h1>
      <br>
      <p>MONETLOADER & MOONLOADER SA-MP PROTECTOR</p>
    </header>

    <div class="panel-group">
      <div class="input-row">
        <label>1. Upload Script Lua (.lua)</label>
        <input type="file" id="fileUpload" class="file-input-hidden" accept=".lua,.txt">
        <button type="button" class="btn btn-yellow" onclick="document.getElementById('fileUpload').click()">📁 Pilih File Lua Dari Perangkat</button>
      </div>

      <div class="input-row" style="margin-top: 8px;">
        <label for="outputFileName">2. Nama File Hasil Download (.luac):</label>
        <input type="text" id="outputFileName" value="script_protected.luac" placeholder="contoh: script_v1.luac">
      </div>
    </div>

    <div class="editor-grid">
      <div class="box">
        <div class="box-title">
          <span>Source Code Lua</span>
          <span class="badge">INPUT</span>
        </div>
        <textarea id="luaInput" placeholder="-- Ketik atau upload script Lua MonetLoader kamu di sini...&#10;function main()&#10;    sampAddChatMessage('Protected by LuaJIT', -1)&#10;end"></textarea>
        
        <div class="button-group">
          <button class="btn" id="btnObfuscate">⚡ PROTECT / COMPILE</button>
          <button class="btn btn-pink" id="btnClear">CLEAR</button>
        </div>
      </div>

      <div class="box">
        <div class="box-title">
          <span>Protected Output Preview</span>
          <span class="badge">OUTPUT</span>
        </div>
        <textarea id="luaOutput" readonly placeholder="-- Preview bytecode compiled akan muncul di sini..."></textarea>
        
        <div class="button-group">
          <button class="btn btn-cyan" id="btnCopy">📋 COPY PREVIEW</button>
          <button class="btn" id="btnDownload">💾 DOWNLOAD .LUAC</button>
        </div>
      </div>
    </div>

    <div id="statusBar"></div>

    <footer>
      MONETLOADER SA-MP 5.1 OBFUSCATOR ENGINE &copy; 2026
    </footer>
  </div>

  <script>
    const luaInput = document.getElementById('luaInput');
    const luaOutput = document.getElementById('luaOutput');
    const fileUpload = document.getElementById('fileUpload');
    const outputFileName = document.getElementById('outputFileName');
    const btnObfuscate = document.getElementById('btnObfuscate');
    const btnClear = document.getElementById('btnClear');
    const btnCopy = document.getElementById('btnCopy');
    const btnDownload = document.getElementById('btnDownload');
    const statusBar = document.getElementById('statusBar');

    let currentBase64Data = "";

    function showStatus(msg, type) {
      statusBar.style.display = 'block';
      statusBar.className = '';
      statusBar.textContent = msg;
      if (type === 'loading') statusBar.classList.add('status-loading');
      if (type === 'success') statusBar.classList.add('status-success');
      if (type === 'error') statusBar.classList.add('status-error');
    }

    function hideStatus() { statusBar.style.display = 'none'; }

    fileUpload.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      outputFileName.value = 'protected_' + file.name.replace(/\.[^/.]+$/, "") + ".luac";

      const reader = new FileReader();
      reader.onload = function(e) {
        luaInput.value = e.target.result;
        showStatus(`[SUCCESS] File "${file.name}" berhasil dimuat!`, 'success');
        setTimeout(hideStatus, 3000);
      };
      reader.readAsText(file);
    });

    btnObfuscate.addEventListener('click', async () => {
      const code = luaInput.value.trim();
      if (!code) {
        showStatus('[ERROR] Kode Lua input masih kosong!', 'error');
        return;
      }

      showStatus('[PROCESSING] Mengompilasi Bytecode LuaJIT 5.1...', 'loading');
      btnObfuscate.disabled = true;

      try {
        const response = await fetch('/api/obfuscate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          luaOutput.value = data.result;
          currentBase64Data = data.base64Data;
          showStatus('[SUCCESS] Berhasil dikompilasi ke bytecode biner `.luac`!', 'success');
        } else {
          showStatus(`[SERVER ERROR] ${data.error || 'Gagal memproses kode.'}`, 'error');
        }
      } catch (err) {
        showStatus(`[CONNECTION ERROR] Gagal menghubungi backend API: ${err.message}`, 'error');
      } finally {
        btnObfuscate.disabled = false;
      }
    });

    btnClear.addEventListener('click', () => {
      luaInput.value = '';
      luaOutput.value = '';
      fileUpload.value = '';
      currentBase64Data = "";
      hideStatus();
    });

    btnCopy.addEventListener('click', () => {
      if (!luaOutput.value) {
        showStatus('[ERROR] Belum ada hasil untuk disalin!', 'error');
        return;
      }
      navigator.clipboard.writeText(luaOutput.value);
      showStatus('[COPIED] Preview berhasil disalin!', 'success');
      setTimeout(hideStatus, 3000);
    });

    btnDownload.addEventListener('click', () => {
      if (!currentBase64Data) {
        showStatus('[ERROR] Belum ada bytecode untuk didownload!', 'error');
        return;
      }

      let filename = outputFileName.value.trim() || 'script_protected.luac';
      if (!filename.endsWith('.luac')) filename += '.luac';

      // Mengubah Base64 dari backend kembali menjadi Uint8Array biner murni
      const binaryString = atob(currentBase64Data);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      const blob = new Blob([bytes], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showStatus(`[SUCCESS] File biner "${filename}" berhasil diunduh!`, 'success');
      setTimeout(hideStatus, 3000);
    });
  </script>
</body>
</html>
