<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MORGAN LUAC - Neubrutalism Edition</title>
  <style>
    :root {
      --bg: #ffde59;
      --card-bg: #ffffff;
      --accent: #ff5757;
      --secondary: #5271ff;
      --border: #000000;
    }

    * {
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
    }

    body {
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 4px solid var(--border);
      box-shadow: 8px 8px 0px var(--border);
      padding: 25px;
    }

    h1 {
      font-size: 26px;
      text-transform: uppercase;
      background: var(--accent);
      color: white;
      padding: 12px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0px var(--border);
      margin-top: 0;
      text-align: center;
      letter-spacing: 1px;
    }

    .dropzone {
      border: 4px dashed var(--border);
      background: #f0f0f0;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
      transition: 0.2s;
    }

    .dropzone.hover {
      background: #d1e7dd;
    }

    .dropzone p {
      margin: 0;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      text-transform: uppercase;
      font-size: 14px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0px var(--border);
      background: #fff;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      text-transform: uppercase;
      background: var(--secondary);
      color: white;
      border: 3px solid var(--border);
      box-shadow: 5px 5px 0px var(--border);
      cursor: pointer;
      margin-top: 10px;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0px var(--border);
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      border: 3px solid var(--border);
      display: none;
      word-break: break-all;
      font-size: 14px;
    }

    .status.success {
      background: #73d13d;
      color: black;
    }

    .status.error {
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>MORGAN LUAC ⚡</h1>

  <!-- Drag & Drop Zone -->
  <div class="dropzone" id="dropzone">
    <p id="file-label">📁 SERET & DROP FILE .LUA DI SINI<br><small>(atau klik untuk pilih file)</small></p>
    <input type="file" id="file-input" accept=".lua,.luac" style="display: none;">
  </div>

  <!-- Preset Selector -->
  <div class="form-group">
    <label for="preset">PILIH MODE PROTEKSI:</label>
    <select id="preset">
      <option value="moonsec">MorganSec Anti-Tamper + Mini-VM</option>
      <option value="luraph">Base64 Stream Sandbox</option>
      <option value="ast">Standard XOR Encrypt</option>
    </select>
  </div>

  <!-- Custom Rename File -->
  <div class="form-group">
    <label for="out-filename">NAMA FILE HASIL DOWNLOAD:</label>
    <input type="text" id="out-filename" value="protected_script.lua" placeholder="contoh: nametag_pro.lua">
  </div>

  <!-- Action Button -->
  <button id="obf-btn">LOCK & OBFUSCATE 🔒</button>

  <!-- Status Info -->
  <div id="status-box" class="status"></div>
</div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  const fileLabel = document.getElementById('file-label');
  const obfBtn = document.getElementById('obf-btn');
  const outFilenameInput = document.getElementById('out-filename');
  const statusBox = document.getElementById('status-box');

  let loadedCode = "";

  dropzone.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      handleFile(e.target.files[0]);
    }
  });

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('hover');
  });

  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('hover'));

  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('hover');
    if (e.dataTransfer.files.length > 0) {
      handleFile(e.dataTransfer.files[0]);
    }
  });

    reader.onload = (e) => {
      loadedCode = e.target.result;
      fileLabel.innerHTML = `✅ FILE TERPILIH:<br><strong>${file.name}</strong>`;
      
      const nameParts = file.name.split('.');
      outFilenameInput.value = `${nameParts[0]}_protected.lua`;
      showStatus("File berhasil dimuat, siap dikunci!", "success");
    };
    reader.readAsText(file);
  }

    if (!loadedCode) {
      showStatus("Silakan upload file Lua terlebih dahulu!", "error");
      return;

        method: 'POST',

        body: JSON.stringify({

          preset: document.getElementById('preset').value
        })
