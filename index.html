<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MORGAN LUAC - Neubrutalism Edition</title>
  <style>
    :root {
      --bg: #ffde59;
      --card-bg: #ffffff;
      --accent: #ff5757;
      --secondary: #5271ff;
      --border: #000000;
    }

    * {
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
    }

    body {
      background-color: var(--bg);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card-bg);
      border: 4px solid var(--border);
      box-shadow: 8px 8px 0px var(--border);
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      text-transform: uppercase;
      background: var(--accent);
      color: white;
      padding: 12px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0px var(--border);
      margin-top: 0;
      text-align: center;
      letter-spacing: 1px;
    }

    .dropzone {
      border: 4px dashed var(--border);
      background: #f0f0f0;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 15px;
      transition: 0.2s;
    }

    .dropzone.hover {
      background: #d1e7dd;
    }

    .dropzone p {
      margin: 0;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      text-transform: uppercase;
      font-size: 13px;
    }

    input[type="text"], select, textarea {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0px var(--border);
      background: #fff;
      outline: none;
    }

    textarea {
      height: 120px;
      resize: vertical;
      white-space: pre;
      font-family: monospace;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      text-transform: uppercase;
      background: var(--secondary);
      color: white;
      border: 3px solid var(--border);
      box-shadow: 5px 5px 0px var(--border);
      cursor: pointer;
      margin-top: 5px;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0px var(--border);
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      border: 3px solid var(--border);
      display: none;
      word-break: break-all;
      font-size: 13px;
    }

    .status.success {
      background: #73d13d;
      color: black;
    }

    .status.error {
      background: var(--accent);
      color: white;
    }

    .btn-copy {
      background: #00d26a;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>MORGAN LUAC ⚡</h1>

  <!-- Drag & Drop Zone -->
  <div class="dropzone" id="dropzone">
    <p id="file-label">📁 SERET & DROP FILE .LUA DI SINI<br><small>(atau klik di sini untuk pilih file)</small></p>
    <input type="file" id="file-input" accept=".lua,.luac" style="display: none;">
  </div>

  <!-- Source Input Text Area -->
  <div class="form-group">
    <label for="source-code">ATAU PASTE SOURCE CODE LUA DI SINI:</label>
    <textarea id="source-code" placeholder="function main()&#10;    sampAddChatMessage('Halo Morgan!', -1)&#10;end"></textarea>
  </div>

  <!-- Preset Selector -->
  <div class="form-group">
    <label for="preset">PILIH MODE PROTEKSI:</label>
    <select id="preset">
      <option value="moonsec">MorganSec
