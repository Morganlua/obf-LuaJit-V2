<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morganz MonetLoader Obfuscator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin-bottom: 5px; color: #38bdf8; font-size: 24px; text-align: center; }
    p.subtitle { margin-bottom: 20px; color: #94a3b8; font-size: 14px; text-align: center; }
    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    textarea {
      width: 100%;
      height: 220px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 12px;
      font-family: monospace;
      font-size: 13px;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: #38bdf8; }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-protect { background-color: #0284c7; color: white; }
    .btn-protect:hover { background-color: #0369a1; }
    .btn-download { background-color: #16a34a; color: white; }
    .btn-download:hover { background-color: #15803d; }
  </style>
</head>
<body>

  <h1>Morganz MonetLoader Obfuscator</h1>
  <p class="subtitle">LuaJIT 5.1 Bytecode Compiler & String XOR Encryptor for SA-MP Android</p>

  <div class="container">
    <textarea id="luaInput" placeholder="-- Masukkan kode Lua kamu di sini..."></textarea>
    
    <div class="btn-group">
      <button class="btn-protect" onclick="processObfuscate()">🔒 PROTECT SCRIPT</button>
      <button class="btn-download" onclick="downloadLuac()">💾 DOWNLOAD .LUAC</button>
    </div>

    <textarea id="luaOutput" readonly placeholder="-- Status hasil enkripsi & kompilasi akan muncul di sini..."></textarea>
  </div>

  <script>
    let lastBase64Data = "";

    async function processObfuscate() {
      const code = document.getElementById('luaInput').value;
      const outputBox = document.getElementById('luaOutput');

      if (!code.trim()) {
        alert("Masukkan kode Lua terlebih dahulu!");
        return;
      }

      outputBox.value = "Memproses kompilasi & enkripsi XOR...";

      try {
        const response = await fetch('/api/obfuscate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code })
        });

        const data = await response.json();

        if (data.success) {
          outputBox.value = data.result;
          lastBase64Data = data.base64Data;
        } else {
          outputBox.value = "ERROR: " + data.error;
          lastBase64Data = "";
        }
      } catch (err) {
        outputBox.value = "CONNECTION ERROR: " + err.message;
        lastBase64Data = "";
      }
    }

    function downloadLuac() {
      if (!lastBase64Data) {
        alert("Belum ada file terkompilasi yang siap didownload!");
        return;
      }

      // Konversi Base64 kembali ke Uint8Array Biner Murni
      const binaryString = atob(lastBase64Data);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // Download sebagai file biner .luac
      const blob = new Blob([bytes], { type: 'application/octet-stream' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'protected_script.luac';
      link.click();
    }
  </script>
</body>
</html>
